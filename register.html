<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieBook - Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <a href="index.html" class="logo">
                🎬 <span>Movie</span>Book

            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">🏠 Home</a>
                </li>

                <li>
                    <a href="movies.html">🎬 Movies</a>
                </li>

                <li>
                    <a href="theatres1.html">🎭 Theatres</a>
                </li>

                <li>
                    <a href="bookings.html">🎟️ My Bookings</a>

                </li>
                <li>
    <a href="contact.html">
        📞 Contact
    </a>
</li>

            </ul>

            <div class="nav-buttons">
                <a href="login.html" class="login-btn">
                    Login
                </a>

                <a href="register.html" class="register-btn">
                    Register
                </a>
            </div>

        </nav>
    </header>


    <!-- Registration Section -->
    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                🎬
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join MovieBook and start booking your favourite movies.
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Mobile -->
                <div class="form-group">

                    <label for="registerPhone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        name="phone"
                        placeholder="Enter your mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('registerPassword', this)">
                            👁️
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword', this)">
                            👁️
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <div class="terms-box">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-btn">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MovieBook. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
